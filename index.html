<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sermon Library</title>

<link rel="icon" type="image/png" href="tjc_icon_512.png">
<link rel="apple-touch-icon" href="tjc_icon_512.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sermon Library">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B2545">

<style>
  body{
    font-family:Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    margin:0;
    background:#f3f6fb;
    color:#0B2545;
    text-align:center;
    padding:20px;
    box-sizing:border-box;
  }
  a{
    margin-top:16px;
    color:#0B2545;
    font-weight:bold;
  }
</style>
</head>
<body>
  <p>Opening Sermon Library in <span id="countdown">5</span> seconds...</p>
  <a href="https://script.google.com/a/macros/tjc.org.my/s/AKfycbwkq6MD24AU29wFWlYpQrq82RjEB6p-loA2laq483kR2wCWzt9STgqCRWhDXTvuoa8pSA/exec">Tap here to go now</a>
  <script>
    var seconds = 5;
    var countdownEl = document.getElementById("countdown");
    var timer = setInterval(function(){
      seconds--;
      countdownEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "https://script.google.com/a/macros/tjc.org.my/s/AKfycbwkq6MD24AU29wFWlYpQrq82RjEB6p-loA2laq483kR2wCWzt9STgqCRWhDXTvuoa8pSA/exec";
      }
    }, 1000);
  </script>
</body>
</html>
