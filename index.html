<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sermon Library</title>

<link rel="icon" type="image/png" href="tjc_icon_512.png">
<link rel="apple-touch-icon" href="tjc_icon_512.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sermon Library">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B2545">

<style>
  body{
    font-family:Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    margin:0;
    background:#f3f6fb;
    color:#0B2545;
    text-align:center;
    padding:20px;
    box-sizing:border-box;
  }
  p{
    max-width:320px;
    line-height:1.5;
  }
  a{
    margin-top:24px;
    display:inline-block;
    background:#0B2545;
    color:white;
    text-decoration:none;
    font-weight:bold;
    padding:14px 28px;
    border-radius:30px;
  }
</style>
</head>
<body id="landingBody" style="display:none;">
  <p>Tip: tap the menu (⋮) and choose "Add to Home screen" now, then tap the button below whenever you're ready.</p>
  <a href="https://script.google.com/a/macros/tjc.org.my/s/AKfycbwkq6MD24AU29wFWlYpQrq82RjEB6p-loA2laq483kR2wCWzt9STgqCRWhDXTvuoa8pSA/exec">Open Sermon Library</a>

  <script>
    var appUrl = "https://script.google.com/a/macros/tjc.org.my/s/AKfycbwkq6MD24AU29wFWlYpQrq82RjEB6p-loA2laq483kR2wCWzt9STgqCRWhDXTvuoa8pSA/exec";
    var isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

    if (isStandalone) {
      window.location.replace(appUrl);
    } else {
      document.getElementById("landingBody").style.display = "flex";
    }
  </script>
</body>
</html>
